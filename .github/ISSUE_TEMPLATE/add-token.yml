name: Add or update a token
description: Ask for a token to be priced in the Radix Wallet, or change the pools of a listed token.
title: "Add token: "
labels: [token-request, add-token]
body:
  - type: markdown
    attributes:
      value: |
        After you submit, an automated check reads the token and its pools from Radix mainnet and posts the result here. If everything passes, it opens a pull request; a RadixDAO maintainer reviews and merges it, and the merge puts the token live.

        **Pool requirements**
        - The token must trade in a pool against **XRD** (or against a token already on the list).
        - Each pool must hold at least **$100** of liquidity (both sides together).
        - Supported pools: **Ociswap Flex pools** (the usual kind), also Ociswap Precision and Basic pools, and **DefiPlaza** pairs. Pools on other DEXes can't be priced yet.
  - type: input
    attributes:
      label: Symbol
      description: Short symbol, used as the token's name in the list (letters, digits, `.`, `_`, `-`). To change the pools of a listed token, use its existing symbol.
      placeholder: HYDR
    validations:
      required: true
  - type: input
    attributes:
      label: Name
      description: Optional display name.
      placeholder: Hydrate
  - type: input
    attributes:
      label: Resource address
      description: The token's address, starting with `resource_rdx1`. You can also paste the token's link from ociswap.com or the Radix Dashboard.
      placeholder: resource_rdx1t5lenm5rr0p7urmcfjpzq5syt7cpges3wv3hzefckqe49ga6wutrhf
    validations:
      required: true
  - type: textarea
    attributes:
      label: Pools
      description: |
        **Easiest: leave this empty.** The check then finds the token's pools on Ociswap and DefiPlaza by itself and uses the ones with at least $100 of liquidity.

        To choose the pools yourself, open each pool on ociswap.com, copy the link from the browser's address bar and paste it here, **one pool per line**. A pool's address (`component_rdx1…`) on its own works too, which is how to give a DefiPlaza pair. Don't paste the token's address (`resource_rdx1…`) here.

        Example, two pools:
        ```
        https://ociswap.com/pools/component_rdx1cpcwm3w254rjc74xpqjcla08tjd6ms3eyzc5yfmhuwuha6vas0dr2c
        component_rdx1cpj25l4f8v2n4xl2auhwsagwmt5mmxsavxttmkpl90cr2qnyejqcmt
        ```
      placeholder: |
        Leave empty to find the pools automatically, or paste one pool link per line, e.g.
        https://ociswap.com/pools/component_rdx1cpcwm3w254rjc74xpqjcla08tjd6ms3eyzc5yfmhuwuha6vas0dr2c
  - type: input
    attributes:
      label: CoinGecko ID
      description: Optional. The ID from the token's CoinGecko page URL. Its price must agree with the pools within 10%.
      placeholder: hydrate
